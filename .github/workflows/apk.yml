name: APK bauen

on:
  push:
    branches: [herzfaenger-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Festen Schlüssel aus den Secrets holen
        env:
          HF_KEYSTORE_BASE64: ${{ secrets.HF_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$HF_KEYSTORE_BASE64" ]; then
            echo "::warning::Kein fester Schlüssel hinterlegt. Die App wird mit einem einmaligen Schlüssel gebaut: vor einem Update den Spielstand über 'Spielstand sichern' kopieren."
            exit 0
          fi
          echo "$HF_KEYSTORE_BASE64" | base64 -d > app/herzfaenger.keystore

      - name: APK bauen
        env:
          HF_KEYSTORE_PASSWORD: ${{ secrets.HF_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Herzfaenger.apk

      - name: APK zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Herzfaenger-APK
          path: Herzfaenger.apk

      - name: Als Release veröffentlichen (direkter Download am Handy)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Herzfänger ${{ github.run_number }}
          body: APK antippen, herunterladen und installieren.
          files: Herzfaenger.apk
          make_latest: true
