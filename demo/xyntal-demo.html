<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xyntal – interaktive Demo</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/fonts/fonts.css">
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <!-- Xyntal Demo: Alle Daten sind Beispiele. Die Oberfläche wird von demo.js erzeugt. -->
  <div class="app" id="app">
    <aside class="side" id="side" aria-label="Navigation"></aside>
    <div class="scrim" data-act="nav"></div>
    <div class="main">
      <header class="top">
        <button class="ibtn plain menu-btn" data-act="nav" aria-label="Menü"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <span class="top__title" id="topTitle">Dashboard</span>
        <span class="demo-chip">Demo · Beispieldaten</span>
        <button class="search" data-act="palette" aria-label="Suchen">
          <svg class="i sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span class="lbl">Suchen oder Aktion …</span><span class="kbd">Strg K</span>
        </button>
        <button class="btn pri btn-new" data-act="newMenu" aria-label="Neu erstellen"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="new-lbl">Neu</span></button>
        <button class="ibtn" data-act="bell" aria-label="Benachrichtigungen"><svg class="i" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="dot" id="bellDot"></span></button>
      </header>
      <main class="view" id="view"></main>
    </div>
  </div>
  <div id="layer"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="demo.js"></script>
</body>
</html>
